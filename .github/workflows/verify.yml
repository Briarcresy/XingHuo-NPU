name: Verify RTL

on:
  push:
  pull_request:

jobs:
  open-source-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RTL simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog

      - name: Run lint, golden-model tests and RTL verification
        run: make lint test
